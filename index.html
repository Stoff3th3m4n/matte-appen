<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MatteMästaren</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff;
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* 📱 Universell touch-fix för iOS och Android */
        button, select, input, label, .tip-btn {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media print {
            @page { margin: 15mm; size: A4; }
            body {
                background: white !important;
                height: auto !important;
                overflow: visible !important;
            }
            .no-print { display: none !important; }
            .print-area {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                background: white !important;
            }
            .print-page {
                break-after: page;
                page-break-after: always;
            }
            .avoid-break { break-inside: avoid; }
            .answer-line {
                border-bottom: 2px dotted #64748b;
                width: 50px;
                display: inline-block;
            }
        }

        .collapse-container {
            transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out, margin 0.4s ease-in-out;
            max-height: 3500px;
            opacity: 1;
            overflow: hidden;
        }
        .collapse-container.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            margin-bottom: 0;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen md:h-screen overflow-auto md:overflow-hidden text-slate-800">

    <aside class="w-full md:w-[350px] flex-shrink-0 bg-white shadow-2xl flex flex-col no-print h-auto md:h-full z-20 border-b-8 md:border-b-0 md:border-r-8 border-sky-100">
        <div class="p-6 bg-gradient-to-br from-pink-400 to-rose-500 text-white rounded-br-3xl shadow-sm border-b-4 border-rose-600">
            <h1 class="text-4xl font-black tracking-tight drop-shadow-md">Matte<br>Mästaren</h1>
            <p class="text-md font-bold opacity-90 mt-2 bg-white/20 inline-block px-3 py-1 rounded-full">⭐ Bli ett proffs! ⭐</p>
        </div>
        
        <div class="p-6 flex-1 overflow-y-auto custom-scrollbar">
            
            <div class="mb-8 bg-sky-50 p-4 rounded-2xl border-4 border-sky-200 shadow-sm">
                <h2 class="font-black text-sky-900 mb-2 text-xl uppercase tracking-wide">1. Välj räknesätt:</h2>
                <select id="operation-select" class="w-full bg-white border-4 border-sky-300 rounded-xl p-3 text-xl font-bold text-sky-800 hover:border-sky-400 focus:border-sky-500 focus:outline-none focus:ring-4 focus:ring-sky-100 transition-all cursor-pointer shadow-inner">
                    <option value="mul" selected>✖️ Multiplikation</option>
                    <option value="add">➕ Addition</option>
                    <option value="sub">➖ Subtraktion</option>
                    <option value="div">➗ Division</option>
                </select>
            </div>

            <h2 class="font-black text-slate-700 mb-3 text-xl flex items-center gap-2">
                <span>2. Välj tabeller/tal:</span>
            </h2>
            
            <div class="grid grid-cols-2 gap-3 mb-8" id="table-checkboxes">
                <!-- Javascript fyller i 1-10 här -->
            </div>

            <div class="border-t-4 border-dashed border-slate-200 pt-6 mb-4">
                <h2 class="font-black text-slate-700 mb-4 text-xl">3. Övningstyp:</h2>
                <label class="flex items-center space-x-3 cursor-pointer group bg-slate-50 p-3 rounded-2xl border-4 border-slate-100 hover:border-sky-200 hover:bg-sky-50 transition">
                    <input type="checkbox" id="include-ordered" checked class="w-6 h-6 text-sky-500 rounded border-slate-300 focus:ring-sky-500 focus:ring-2">
                    <span class="text-slate-700 font-bold text-lg group-hover:text-sky-700">Tabeller i ordning</span>
                </label>
                <label class="flex items-center space-x-3 cursor-pointer group bg-slate-50 p-3 rounded-2xl border-4 border-slate-100 hover:border-pink-200 hover:bg-pink-50 transition mt-3">
                    <input type="checkbox" id="include-mixed" checked class="w-6 h-6 text-pink-500 rounded border-slate-300 focus:ring-pink-500 focus:ring-2">
                    <span class="text-slate-700 font-bold text-lg group-hover:text-pink-700">Blandade tal</span>
                </label>
            </div>
            
            <div id="error-msg" class="hidden mt-4 bg-red-100 text-red-700 p-4 rounded-2xl font-bold text-md text-center border-4 border-red-200 pop-in">
                Hoppsan! Välj minst en tabell.
            </div>
        </div>

        <div class="p-5 bg-sky-50 border-t-4 border-sky-100 flex flex-col gap-3">
            <button id="btn-interactive" class="w-full bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 text-white font-black py-4 px-4 rounded-2xl transition shadow-lg transform hover:-translate-y-1 text-xl border-b-8 border-green-700 active:border-b-0 active:translate-y-2">
                🎮 Spela på skärmen
            </button>
            <button id="btn-print-layout" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-2xl transition shadow-md border-b-4 border-slate-900 active:border-b-0 active:translate-y-1 mt-2">
                📄 Skapa övningsblad
            </button>
        </div>
    </aside>

    <main id="main-content" class="flex-1 overflow-y-auto relative no-print-bg bg-white md:bg-transparent">
        <div id="action-bar" class="sticky top-0 z-10 p-4 flex justify-center gap-4 bg-white/90 backdrop-blur-md shadow-sm border-b-4 border-slate-100 hidden no-print">
            <button id="btn-grade" class="hidden bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white font-black py-3 px-10 rounded-full shadow-lg text-2xl transform hover:scale-105 transition border-b-4 border-indigo-800 active:border-b-0 active:translate-y-1">
                ✨ RÄTTA MINA SVAR ✨
            </button>
            <button id="btn-do-print" class="hidden bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-full shadow-lg text-xl transform hover:scale-105 transition">
                🖨️ Skriv ut nu
            </button>
        </div>

        <div class="p-4 md:p-8 flex justify-center pb-32">
            <!-- Interaktiv Yta -->
            <div id="interactive-container" class="w-full max-w-6xl hidden flex-col items-center">
                <div id="interactive-ordered" class="w-full flex flex-wrap justify-center gap-6 mb-8 collapse-container"></div>
                <button id="btn-unhide-ordered" class="hidden bg-sky-100 hover:bg-sky-200 text-sky-800 font-black py-4 px-8 rounded-2xl border-4 border-sky-300 shadow-sm transition-all mb-8 pop-in text-lg flex items-center gap-3">
                    <span class="text-2xl">👀</span> Visa tabellerna i ordning igen!
                </button>
                <div id="interactive-mixed" class="w-full flex flex-wrap justify-center gap-6 mt-4"></div>
            </div>

            <!-- Utskriftsyta -->
            <div id="print-container" class="print-area bg-white shadow-2xl w-full max-w-[210mm] min-h-[297mm] p-10 hidden mx-auto"></div>
            
            <div id="empty-state" class="text-center mt-24 no-print flex flex-col items-center slide-up">
                <div class="text-8xl mb-6 bg-white w-40 h-40 flex items-center justify-center rounded-full shadow-xl border-8 border-sky-100">🚀</div>
                <h2 class="text-4xl font-black text-slate-700">Dags att räkna!</h2>
                <p class="text-slate-500 font-bold mt-4 max-w-sm text-lg bg-white p-4 rounded-2xl shadow-sm border-2 border-slate-100">Gör dina val i menyn till vänster och starta!</p>
            </div>
        </div>
    </main>

    <div id="result-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center no-print">
        <div class="bg-white rounded-3xl p-10 max-w-md w-full mx-4 shadow-2xl text-center transform scale-90 transition-transform duration-300 border-8 border-indigo-400" id="modal-content">
            <div id="result-emoji" class="text-9xl mb-6 pop-in" style="animation-delay: 0.2s;">🌟</div>
            <h2 id="result-title" class="text-4xl font-black text-slate-800 mb-3">Snyggt jobbat!</h2>
            <p id="result-text" class="text-2xl text-slate-600 font-bold mb-8">Du fick <span id="score-correct" class="text-emerald-500 text-3xl font-black">0</span> av <span id="score-total">0</span> rätt!</p>
            <button id="btn-close-modal" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-black py-4 px-6 rounded-2xl w-full transition text-xl border-b-4 border-indigo-300 active:border-b-0 active:translate-y-1">
                Stäng och se svaren
            </button>
        </div>
    </div>

    <script>
        const colorThemes = [
            { bg: 'bg-red-50', text: 'text-red-600', ring: 'focus:ring-red-400', border: 'border-red-200' },
            { bg: 'bg-orange-50', text: 'text-orange-600', ring: 'focus:ring-orange-400', border: 'border-orange-200' },
            { bg: 'bg-amber-50', text: 'text-amber-600', ring: 'focus:ring-amber-400', border: 'border-amber-200' },
            { bg: 'bg-lime-50', text: 'text-lime-600', ring: 'focus:ring-lime-400', border: 'border-lime-200' },
            { bg: 'bg-emerald-50', text: 'text-emerald-600', ring: 'focus:ring-emerald-400', border: 'border-emerald-200' },
            { bg: 'bg-teal-50', text: 'text-teal-600', ring: 'focus:ring-teal-400', border: 'border-teal-200' },
            { bg: 'bg-cyan-50', text: 'text-cyan-600', ring: 'focus:ring-cyan-400', border: 'border-cyan-200' },
            { bg: 'bg-blue-50', text: 'text-blue-600', ring: 'focus:ring-blue-400', border: 'border-blue-200' },
            { bg: 'bg-indigo-50', text: 'text-indigo-600', ring: 'focus:ring-indigo-400', border: 'border-indigo-200' },
            { bg: 'bg-purple-50', text: 'text-purple-600', ring: 'focus:ring-purple-400', border: 'border-purple-200' }
        ];

        const checkboxContainer = document.getElementById('table-checkboxes');
        for (let i = 1; i <= 10; i++) {
            const theme = colorThemes[i-1];
            const label = document.createElement('label');
            label.className = `flex items-center space-x-3 cursor-pointer p-3 rounded-2xl transition border-4 border-slate-100 hover:${theme.border} hover:${theme.bg} bg-white shadow-sm`;
            label.innerHTML = `
                <input type="checkbox" value="${i}" class="table-cb w-6 h-6 rounded border-slate-300 ${theme.text} ${theme.ring} focus:ring-2">
                <span class="text-slate-700 font-bold text-lg">Tal ${i}</span>
            `;
            checkboxContainer.appendChild(label);
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateProblemData() {
            const checkboxes = document.querySelectorAll('.table-cb:checked');
            const selectedTables = Array.from(checkboxes).map(cb => parseInt(cb.value));
            const includeOrdered = document.getElementById('include-ordered').checked;
            const includeMixed = document.getElementById('include-mixed').checked;
            const opSelect = document.getElementById('operation-select').value;

            if (selectedTables.length === 0 || (!includeOrdered && !includeMixed)) {
                document.getElementById('error-msg').classList.remove('hidden');
                return null;
            }
            document.getElementById('error-msg').classList.add('hidden');

            const opMap = { 'add': '+', 'sub': '-', 'mul': '×', 'div': '÷' };
            const opSymbol = opMap[opSelect];

            let orderedBoxes = [];
            let allMixed = [];

            selectedTables.forEach(base => {
                let problems = [];
                for (let i = 1; i <= 10; i++) {
                    let a, b, ans;
                    if (opSelect === 'add') {
                        a = base; b = i; ans = a + b;
                    } else if (opSelect === 'sub') {
                        b = base; ans = i; a = b + ans; 
                    } else if (opSelect === 'mul') {
                        a = base; b = i; ans = a * b;
                    } else if (opSelect === 'div') {
                        b = base; ans = i; a = b * ans;
                    }
                    
                    problems.push({ a, b, ans, op: opSymbol });
                    
                    const flip = (opSelect === 'add' || opSelect === 'mul') ? Math.random() > 0.5 : false;
                    allMixed.push({ 
                        a: flip ? b : a, 
                        b: flip ? a : b, 
                        ans: ans,
                        op: opSymbol
                    });
                }
                if(includeOrdered) {
                    orderedBoxes.push({ title: `Tabell ${base}`, problems, color: colorThemes[base-1] });
                }
            });

            let mixedBoxes = [];
            if (includeMixed) {
                allMixed = shuffleArray(allMixed);
                for (let i = 0; i < allMixed.length; i += 10) {
                    mixedBoxes.push({ 
                        title: `Blandade tal (${(i/10)+1})`, 
                        problems: allMixed.slice(i, i + 10), 
                        color: { bg: 'bg-pink-50', text: 'text-pink-600', border: 'border-pink-200' } 
                    });
                }
            }

            return { orderedBoxes, mixedBoxes };
        }

        function buildBoxHTML(box, isInteractive) {
            let html = `
                <div class="bg-white p-6 rounded-3xl border-4 ${box.color.border} shadow-xl w-full md:w-[380px] ${isInteractive ? 'slide-up' : 'avoid-break h-full flex flex-col'}">
                    <h2 class="text-2xl font-black text-center ${box.color.text} mb-6 uppercase tracking-wider ${box.color.bg} rounded-xl py-3">${box.title}</h2>
                    <div class="flex flex-col space-y-3 flex-grow justify-around">
            `;
            
            let problems = [...box.problems];
            if(!isInteractive) {
                while (problems.length < 10) problems.push({ isDummy: true });
            }

            problems.forEach((p) => {
                if (p.isDummy) {
                    html += `<div class="flex justify-between items-center text-xl font-mono text-transparent select-none"><span>1 × 1 =</span><span class="answer-line h-6"></span></div>`;
                    return;
                }

                if (isInteractive) {
                    html += `
                        <div class="flex flex-col relative group">
                            <div class="input-row flex flex-nowrap justify-between items-center text-2xl font-bold font-mono text-slate-700 bg-slate-50 p-2 rounded-2xl border-2 border-slate-100 hover:border-slate-300 transition-colors z-10 relative overflow-hidden gap-1">
                                <span class="whitespace-nowrap flex-shrink-0 text-right pr-2 min-w-[100px]">${p.a} ${p.op} ${p.b} =</span>
                                <div class="flex flex-nowrap items-center gap-2 flex-shrink-0">
                                    <button type="button" class="tip-btn no-print bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold rounded-xl text-lg border-2 border-amber-300 shadow-sm transition-transform active:scale-95 flex items-center justify-center h-12 w-12" onclick="handleTipClick(event, this)" ontouchstart="handleTipClick(event, this)" data-a="${p.a}" data-b="${p.b}" data-ans="${p.ans}" data-op="${p.op}" title="Visa tips">💡</button>
                                    <input type="number" data-answer="${p.ans}" class="math-input w-20 h-14 text-center font-black text-3xl bg-white border-4 border-slate-200 rounded-xl focus:border-sky-400 focus:outline-none focus:ring-4 focus:ring-sky-100 transition-all text-sky-900 shadow-inner">
                                </div>
                            </div>
                            <div class="tip-container hidden bg-amber-50 border-2 border-amber-200 border-t-0 rounded-b-xl p-4 pt-6 -mt-4 text-center text-amber-900 font-bold slide-up no-print relative z-0 flex flex-col gap-2 shadow-inner"></div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="flex justify-between items-center text-2xl font-bold font-mono text-slate-800 whitespace-nowrap">
                            <span>${p.a} ${p.op} ${p.b} =</span><span class="answer-line h-6"></span>
                        </div>
                    `;
                }
            });
            
            html += `</div></div>`;
            return html;
        }

        // 📱 Hjälpfunktion för att skrolla ner till spelen på små skärmar
        function scrollToContent() {
            if (window.innerWidth < 768) {
                setTimeout(() => {
                    document.getElementById('main-content').scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }
        }

        document.getElementById('btn-interactive').addEventListener('click', () => {
            const data = generateProblemData();
            if (!data) return;

            document.getElementById('print-container').classList.add('hidden');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('btn-do-print').classList.add('hidden');
            
            const iCont = document.getElementById('interactive-container');
            const iOrd = document.getElementById('interactive-ordered');
            const iMix = document.getElementById('interactive-mixed');
            
            iCont.classList.remove('hidden');
            iCont.classList.add('flex');
            document.getElementById('action-bar').classList.remove('hidden');
            
            const btnGrade = document.getElementById('btn-grade');
            btnGrade.classList.remove('hidden');
            btnGrade.classList.add('pop-in');

            iOrd.classList.remove('collapsed');
            document.getElementById('btn-unhide-ordered').classList.add('hidden');

            iOrd.innerHTML = '';
            if (data.orderedBoxes.length > 0) {
                iOrd.style.display = 'flex';
                data.orderedBoxes.forEach(b => iOrd.innerHTML += buildBoxHTML(b, true));
            } else { iOrd.style.display = 'none'; }

            iMix.innerHTML = '';
            if (data.mixedBoxes.length > 0) {
                iMix.style.display = 'flex';
                data.mixedBoxes.forEach(b => iMix.innerHTML += buildBoxHTML(b, true));
            } else { iMix.style.display = 'none'; }

            scrollToContent();
        });

        document.getElementById('btn-print-layout').addEventListener('click', () => {
            const data = generateProblemData();
            if (!data) return;

            document.getElementById('interactive-container').classList.add('hidden');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('btn-grade').classList.add('hidden');
            
            const pCont = document.getElementById('print-container');
            pCont.innerHTML = '';
            pCont.classList.remove('hidden');
            document.getElementById('action-bar').classList.remove('hidden');
            
            const btnDoPrint = document.getElementById('btn-do-print');
            btnDoPrint.classList.remove('hidden');
            btnDoPrint.classList.add('pop-in');

            const allBoxes = [...data.orderedBoxes, ...data.mixedBoxes];
            let pageCount = 1;
            let htmlContent = '';

            for (let i = 0; i < allBoxes.length; i += 4) {
                const chunk = allBoxes.slice(i, i + 4);
                const isLastPage = (i + 4 >= allBoxes.length);
                
                let pageHtml = `
                    <div class="print-page w-full ${!isLastPage ? 'mb-16 pb-16 print:mb-0 print:pb-0' : ''}">
                        <div class="flex justify-between items-end border-b-4 border-slate-800 pb-2 mb-8 mt-2">
                            <div><h1 class="text-4xl font-black text-slate-900">MatteMästaren</h1></div>
                            <div class="text-right">
                                <div class="text-lg text-slate-700 font-bold mb-1">Namn: ______________________</div>
                                <div class="text-sm text-slate-500">Sida ${pageCount++}</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-x-12 gap-y-10">
                `;
                chunk.forEach(box => pageHtml += buildBoxHTML(box, false));
                pageHtml += `</div></div>`;
                htmlContent += pageHtml;
            }
            pCont.innerHTML = htmlContent;

            scrollToContent();
        });

        document.getElementById('interactive-mixed').addEventListener('focusin', (e) => {
            if (e.target.classList.contains('math-input')) {
                const iOrd = document.getElementById('interactive-ordered');
                if (iOrd.innerHTML.trim() !== '' && !iOrd.classList.contains('collapsed')) {
                    iOrd.classList.add('collapsed');
                    document.getElementById('btn-unhide-ordered').classList.remove('hidden');
                }
            }
        });

        document.getElementById('btn-unhide-ordered').addEventListener('click', (e) => {
            document.getElementById('interactive-ordered').classList.remove('collapsed');
            e.target.classList.add('hidden');
        });

        /* --- NY OCH FÖRBÄTTRAD LOGIK FÖR TIPS (UTAN STJÄRNOR) --- */
        function handleTipClick(e, btn) {
            if(e && e.type === 'touchstart' && e.cancelable) e.preventDefault();
            
            const container = btn.closest('.relative.group');
            const tipBox = container.querySelector('.tip-container');
            
            if (tipBox.classList.contains('hidden')) {
                const a = parseInt(btn.getAttribute('data-a'));
                const b = parseInt(btn.getAttribute('data-b'));
                const ans = parseInt(btn.getAttribute('data-ans'));
                const op = btn.getAttribute('data-op');
                
                let visualHtml = '<div class="flex flex-wrap justify-center items-center gap-2 mt-2">';
                
                if (op === '+') {
                    visualHtml += `<div class="text-lg font-bold text-sky-700">${a} och ${b} blir tillsammans ${ans}</div>`;
                } else if (op === '-') {
                    visualHtml += `<div class="text-lg font-bold text-rose-700">Om du har ${a} och tar bort ${b} har du ${ans} kvar</div>`;
                } else if (op === '×') {
                    // Skapar en lista med talet 'a' upprepat 'b' gånger (t.ex. 2x3 blir 2 + 2 + 2)
                    let parts = Array(b).fill(a);
                    visualHtml += `<div class="bg-white rounded-lg px-4 py-2 border-2 border-amber-200 shadow-sm text-amber-700 text-xl font-black font-mono tracking-wider">${parts.join(' + ')} = ${ans}</div>`;
                } else if (op === '÷') {
                    visualHtml += `<div class="text-lg font-bold text-purple-700">Hur många ${b}:or får plats i ${a}?<br>Jo, ${ans} stycken! (${b} × ${ans} = ${a})</div>`;
                }
                visualHtml += '</div>';

                tipBox.innerHTML = `
                    <div class="border-t-4 border-amber-300 w-1/3 mx-auto mb-2 rounded-full opacity-50"></div>
                    <span class="font-mono text-sm text-amber-900 bg-white/80 inline-block px-3 py-1 rounded-xl shadow-sm">Hur tänker vi här?</span>
                    ${visualHtml}
                `;
                tipBox.classList.remove('hidden');
                btn.classList.add('bg-amber-300', 'scale-95');
            } else {
                tipBox.classList.add('hidden');
                btn.classList.remove('bg-amber-300', 'scale-95');
            }
        }

        document.getElementById('btn-grade').addEventListener('click', () => {
            const inputs = document.querySelectorAll('.math-input');
            let correct = 0;
            let total = inputs.length;
            if(total === 0) return;

            document.getElementById('interactive-ordered').classList.remove('collapsed');
            document.getElementById('btn-unhide-ordered').classList.add('hidden');

            inputs.forEach(input => {
                const ans = parseInt(input.value.trim());
                const correctAns = parseInt(input.getAttribute('data-answer'));
                const parentRow = input.closest('.input-row');

                input.className = "math-input w-20 h-14 text-center font-black text-3xl bg-white border-4 rounded-xl focus:outline-none transition-all shadow-inner";
                parentRow.classList.remove('bg-red-50', 'border-red-200', 'bg-green-50', 'border-green-300');
                
                if (isNaN(ans) || ans !== correctAns) {
                    input.classList.add('border-red-500', 'text-red-700', 'bg-red-100');
                    parentRow.classList.add('bg-red-50', 'border-red-200');
                } else {
                    correct++;
                    input.classList.add('border-green-500', 'text-green-700', 'bg-green-100');
                    input.disabled = true;
                    parentRow.classList.add('bg-green-50', 'border-green-300');
                }
            });

            document.getElementById('score-correct').innerText = correct;
            document.getElementById('score-total').innerText = total;
            document.getElementById('result-modal').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('modal-content').classList.remove('scale-90');
                document.getElementById('modal-content').classList.add('scale-100');
            }, 10);
        });

        document.getElementById('btn-close-modal').addEventListener('click', () => {
            document.getElementById('modal-content').classList.remove('scale-100');
            document.getElementById('modal-content').classList.add('scale-90');
            setTimeout(() => document.getElementById('result-modal').classList.add('hidden'), 300);
        });

        document.getElementById('btn-do-print').addEventListener('click', () => window.print());
    </script>
</body>
</html>
